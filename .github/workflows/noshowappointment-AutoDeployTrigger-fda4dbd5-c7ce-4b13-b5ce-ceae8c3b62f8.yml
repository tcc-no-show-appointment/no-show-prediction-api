name: Trigger auto deployment for noshowappointment

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develop ]
    paths:
    - '**'
    - '.github/workflows/noshowappointment-AutoDeployTrigger-fda4dbd5-c7ce-4b13-b5ce-ceae8c3b62f8.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NOSHOWAPPOINTMENT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NOSHOWAPPOINTMENT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NOSHOWAPPOINTMENT_AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with: 
          registry: noshowappointment.azurecr.io
          username: ${{ secrets.NOSHOWAPPOINTMENT_REGISTRY_USERNAME }}
          password: ${{ secrets.NOSHOWAPPOINTMENT_REGISTRY_PASSWORD }}
      
      - name: Build and push container to ACR
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: noshowappointment.azurecr.io/modelprediction:${{ github.sha }}
          file: ./Dockerfile
      
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          containerAppName: noshowappointment
          resourceGroup: resources
          imageToDeploy: noshowappointment.azurecr.io/modelprediction:${{ github.sha }}







