name: Trigger auto deployment for noshowappointment

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develop ]
    paths:
    - '**'
    - '.github/workflows/noshowappointment-AutoDeployTrigger-fda4dbd5-c7ce-4b13-b5ce-ceae8c3b62f8.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NOSHOWAPPOINTMENT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NOSHOWAPPOINTMENT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NOSHOWAPPOINTMENT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: noshowappointment.azurecr.io
          registryUsername: ${{ secrets.NOSHOWAPPOINTMENT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.NOSHOWAPPOINTMENT_REGISTRY_PASSWORD }}
          containerAppName: noshowappointment
          resourceGroup: resources
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_



