name: CI/CD Pipeline for No-Show Appointment

# When this action will be executed
on:
  # Automatically trigger CI on push to these branches
  push:
    branches: 
      - develop
      - homolog
      - main
    paths:
    - '**'
    - '.github/workflows/ci-cd.yml'

  # Trigger CI + Deploy on Pull Requests to homolog or main
  pull_request:
    branches:
      - homolog
      - main

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' && 'dev' || github.ref == 'refs/heads/homolog' && 'homolog' || 'main') || (github.event.pull_request.base.ref == 'homolog' && 'homolog' || 'main') }}
    
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  lint:
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' && 'dev' || github.ref == 'refs/heads/homolog' && 'homolog' || 'main') || (github.event.pull_request.base.ref == 'homolog' && 'homolog' || 'main') }}
    
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run Linting with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  tests:
    runs-on: ubuntu-latest
    needs: lint
    environment: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' && 'dev' || github.ref == 'refs/heads/homolog' && 'homolog' || 'main') || (github.event.pull_request.base.ref == 'homolog' && 'homolog' || 'main') }}
    
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests with pytest
        run: |
          pytest tests/ -v --tb=short

  security:
    runs-on: ubuntu-latest
    needs: tests
    environment: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' && 'dev' || github.ref == 'refs/heads/homolog' && 'homolog' || 'main') || (github.event.pull_request.base.ref == 'homolog' && 'homolog' || 'main') }}
    
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Security Scan with bandit
        run: |
          bandit -r . -ll

  deploy:
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'homolog' || github.event.pull_request.base.ref == 'main')
    environment: ${{ github.event.pull_request.base.ref == 'homolog' && 'homolog' || 'main' }}
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NOSHOWAPPOINTMENT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NOSHOWAPPOINTMENT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NOSHOWAPPOINTMENT_AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push container to Docker Hub
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: guigarciag/modelprediction:${{ github.sha }}
          file: ./Dockerfile
      
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          registryUrl: docker.io
          registryUsername: ${{ secrets.DOCKERHUB_USERNAME }}
          registryPassword: ${{ secrets.DOCKERHUB_PASSWORD }}
          containerAppName: noshowappointmentpublic
          resourceGroup: resources
          imageToDeploy: guigarciag/modelprediction:${{ github.sha }}













